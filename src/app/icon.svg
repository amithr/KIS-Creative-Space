<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- KIS Creativity Space — one rushnyk-red cross-stitch on the cream card. -->
  <rect width="32" height="32" fill="#fbf6ee"/>
  <rect x="1.5" y="1.5" width="29" height="29" fill="none" stroke="#2a211c" stroke-width="3"/>
  <!-- first thread -->
  <path d="M9 9 L23 23" stroke="#b5342c" stroke-width="5" stroke-linecap="round"/>
  <!-- second thread crosses over: a cream halo makes it sit on top -->
  <path d="M23 9 L9 23" stroke="#fbf6ee" stroke-width="8" stroke-linecap="round"/>
  <path d="M23 9 L9 23" stroke="#b5342c" stroke-width="5" stroke-linecap="round"/>
</svg>
